<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jet Framework Docs</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
<meta name="description" content="Jet — a modular TypeScript backend framework built on Hono, with PostgreSQL, Drizzle ORM, and built-in event-driven architecture.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
<style>
  :root { --theme-color: #3451b2; }
  .markdown-section pre { border-radius: 6px; }
  .markdown-section code { border-radius: 4px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
  window.$docsify = {
    name: 'Jet Framework',
    // not "README.md": Vercel's static file serving reserves that exact
    // filename at the deployment root and returns its own 404 for it,
    // even though the file is genuinely present in the deployed output.
    homepage: 'home.md',
    repo: 'khapu2906/jet', // renders the GitHub corner ribbon, top-right
    loadSidebar: true,
    subMaxLevel: 3,
    auto2top: true,
    search: {
      paths: 'auto',
      placeholder: 'Search docs',
    },
    copyCode: {
      buttonText: 'Copy',
      successText: 'Copied',
    },
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
